<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gs Transkriptor</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React y ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel para JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Firebase SDKs -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
      import { getStorage, ref, uploadBytes, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

      const firebaseConfig = {
        apiKey: "AIzaSyCGybg3727XT8wnEG-D08yJ6b...",
        authDomain: "gstranskriptor.firebaseapp.com",
        projectId: "gstranskriptor",
        storageBucket: "gstranskriptor.appspot.com",
        messagingSenderId: "879347989879",
        appId: "1:879347989879:web:0fd610e0215b..."
      };

      const app = initializeApp(firebaseConfig);
      window.db = getFirestore(app);
      window.storage = getStorage(app);
      window.firebaseReady = true;
    </script>
    <style>
        .gold-gradient { background: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C); }
        .gold-text { background: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [files, setFiles] = React.useState([]);
            const [uploading, setUploading] = React.useState(false);
            const [progress, setProgress] = React.useState('');
            const [password, setPassword] = React.useState('amigos123');
            const [savedPassword, setSavedPassword] = React.useState('amigos123');
            const [showSettings, setShowSettings] = React.useState(false);
            const [previewFile, setPreviewFile] = React.useState(null);

            React.useEffect(() => {
                loadFiles();
            }, []);

            const loadFiles = async () => {
                if (!window.db) {
                    setTimeout(loadFiles, 500);
                    return;
                }
                try {
                    const querySnapshot = await getDocs(collection(window.db, "files"));
                    const loaded = querySnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setFiles(loaded);
                } catch (e) {
                    console.error("Error cargando archivos:", e);
                }
            };

            const handleUpload = async (e) => {
                const uploadedFiles = Array.from(e.target.files);
                if (uploadedFiles.length === 0) return;

                setUploading(true);
                for (let file of uploadedFiles) {
                    try {
                        setProgress(`Subiendo ${file.name}...`);
                        const storageRef = ref(window.storage, 'uploads/' + Date.now() + '_' + file.name);
                        await uploadBytes(storageRef, file);
                        const url = await getDownloadURL(storageRef);

                        const fileData = {
                            name: file.name,
                            size: (file.size / (1024*1024)).toFixed(2) + ' MB',
                            type: file.type.includes('video') ? 'video' : file.type.includes('audio') ? 'audio' : file.type.includes('pdf') ? 'pdf' : 'other',
                            url: url,
                            path: storageRef.fullPath,
                            date: new Date().toLocaleDateString()
                        };

                        await addDoc(collection(window.db, "files"), fileData);
                    } catch (err) {
                        alert("Error al subir archivo: " + err.message);
                    }
                }
                setUploading(false);
                setProgress('');
                loadFiles();
            };

            const handleDelete = async (file) => {
                const pass = prompt("Ingresa la contraseña de descarga/gestión:");
                if (pass !== savedPassword) {
                    alert("Contraseña incorrecta");
                    return;
                }
                try {
                    const storageRef = ref(window.storage, file.path);
                    await deleteObject(storageRef);
                    await deleteDoc(doc(window.db, "files", file.id));
                    loadFiles();
                    alert("Archivo eliminado correctamente");
                } catch (e) {
                    alert("Error al eliminar: " + e.message);
                }
            };

            const handleDownload = (file) => {
                const pass = prompt("Ingresa la contraseña para descargar:");
                if (pass !== savedPassword) {
                    alert("Contraseña incorrecta");
                    return;
                }
                window.open(file.url, '_blank');
            };

            return (
                <div className="max-w-4xl mx-auto p-4 sm:p-6">
                    <header className="flex justify-between items-center mb-8 border-b border-yellow-600/30 pb-4">
                        <div className="flex items-center space-x-3">
                            <div className="w-12 h-12 rounded-full gold-gradient flex items-center justify-center font-bold text-gray-950 text-xl shadow-lg shadow-yellow-600/20">
                                GS
                            </div>
                            <div>
                                <h1 className="text-2xl font-black gold-text">Gs Transkriptor</h1>
                                <p className="text-xs text-gray-400">Plataforma Cloud Segura (Hasta 5GB)</p>
                            </div>
                        </div>
                        <button onClick={() => setShowSettings(!showSettings)} className="px-3 py-1.5 rounded-lg border border-yellow-600/40 text-yellow-500 hover:bg-yellow-600/10 text-sm font-medium transition">
                            ⚙️ Ajustes
                        </button>
                    </header>

                    {showSettings && (
                        <div className="mb-6 p-4 rounded-xl bg-gray-900 border border-yellow-600/30">
                            <h3 className="text-sm font-bold text-yellow-500 mb-2">Cambiar Contraseña de Acceso</h3>
                            <div className="flex gap-2">
                                <input type="text" value={password} onChange={(e) => setPassword(e.target.value)} className="bg-gray-950 border border-gray-800 rounded-lg px-3 py-1.5 text-sm flex-1" />
                                <button onClick={() => { setSavedPassword(password); setShowSettings(false); alert("Contraseña actualizada con éxito"); }} className="gold-gradient text-gray-950 font-bold px-4 py-1.5 rounded-lg text-sm">Guardar</button>
                            </div>
                        </div>
                    )}

                    <div className="mb-8 border-2 border-dashed border-yellow-600/40 rounded-2xl p-8 text-center bg-gray-900/40 hover:bg-gray-900/60 transition">
                        <input type="file" multiple id="fileInput" className="hidden" onChange={handleUpload} />
                        <label htmlFor="fileInput" className="cursor-pointer flex flex-col items-center">
                            <div className="w-16 h-16 rounded-full gold-gradient flex items-center justify-center text-gray-950 text-2xl mb-3 shadow-lg">📁</div>
                            <span className="font-bold text-lg text-gray-200">Sube tus archivos aquí</span>
                            <span className="text-xs text-gray-400 mt-1">Videos, audios, documentos (Hasta 5GB)</span>
                        </label>
                        {uploading && <p className="mt-4 text-yellow-400 font-medium animate-pulse">{progress}</p>}
                    </div>

                    <div>
                        <h2 className="text-lg font-bold mb-4 text-yellow-500">Archivos en la Nube ({files.length})</h2>
                        <div className="grid gap-3">
                            {files.map(file => (
                                <div key={file.id} className="flex items-center justify-between p-4 bg-gray-900 rounded-xl border border-gray-800">
                                    <div className="flex items-center space-x-3 overflow-hidden">
                                        <span className="text-2xl">
                                            {file.type === 'video' ? '🎬' : file.type === 'audio' ? '🎵' : file.type === 'pdf' ? '📄' : '📦'}
                                        </span>
                                        <div className="truncate">
                                            <p className="font-medium text-sm truncate text-gray-200">{file.name}</p>
                                            <span className="text-xs text-gray-500">{file.size} • {file.date}</span>
                                        </div>
                                    </div>
                                    <div className="flex items-center space-x-2 shrink-0">
                                        {(file.type === 'video' || file.type === 'audio' || file.type === 'pdf') && (
                                            <button onClick={() => setPreviewFile(file)} className="px-3 py-1.5 text-xs bg-gray-800 hover:bg-gray-700 rounded-lg text-gray-300">Ver</button>
                                        )}
                                        <button onClick={() => handleDownload(file)} className="px-3 py-1.5 text-xs gold-gradient text-gray-950 font-bold rounded-lg">Descargar</button>
                                        <button onClick={() => handleDelete(file)} className="px-2 py-1.5 text-xs bg-red-950/50 hover:bg-red-900 text-red-400 rounded-lg">🗑️</button>
                                    </div>
                                </div>
                            ))}
                            {files.length === 0 && <p className="text-center text-gray-500 py-6 text-sm">No hay archivos en la nube todavía.</p>}
                        </div>
                    </div>

                    {previewFile && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
                            <div className="bg-gray-900 border border-yellow-600/30 rounded-2xl max-w-2xl w-full p-4 relative">
                                <div className="flex justify-between items-center mb-3">
                                    <h3 className="font-bold text-sm truncate text-yellow-500">{previewFile.name}</h3>
                                    <button onClick={() => setPreviewFile(null)} className="text-gray-400 hover:text-white font-bold text-lg px-2">✕</button>
                                </div>
                                <div className="flex justify-center bg-black rounded-lg overflow-hidden max-h-[70vh]">
                                    {previewFile.type === 'video' && <controls controls src={previewFile.url} className="max-h-[60vh] w-full" />}
                                    {previewFile.type === 'audio' && <audio controls src={previewFile.url} className="w-full my-auto" />}
                                    {previewFile.type === 'pdf' && <iframe src={previewFile.url} className="w-full h-[60vh]" />}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
